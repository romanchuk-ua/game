<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Технічні роботи</title>
    <style>
        /* Базові налаштування для сторінки */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #ffffff;
            font-family: Arial, sans-serif;
            overflow: hidden; /* Ховаємо смуги прокрутки */
        }

        /* Налаштування для полотна з крапками */
        #snow-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1; /* Знаходиться на фоні */
            pointer-events: none; /* Щоб крапки не заважали клікати */
        }

        /* Контейнер для тексту по центру */
        .content-container {
            position: relative;
            z-index: 2; /* Знаходиться поверх фону */
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }

        /* Стилі для заголовка */
        h1 {
            color: #000000;
            font-size: 4rem;
            font-weight: bold;
            margin: 0 0 15px 0;
        }

        /* Стилі для підзаголовка */
        p {
            color: #000000;
            font-size: 1.5rem;
            margin: 0;
        }

        /* Адаптивність для мобільних пристроїв */
        @media (max-width: 600px) {
            h1 { font-size: 2.5rem; }
            p { font-size: 1.2rem; }
        }
    </style>
</head>
<body>

    <!-- Полотно для анімації крапок -->
    <canvas id="snow-canvas"></canvas>

    <!-- Текстовий блок -->
    <div class="content-container">
        <h1>Технічні роботи</h1>
        <p>Це буде тривати близько 1 год</p>
    </div>

    <script>
        const canvas = document.getElementById('snow-canvas');
        const ctx = canvas.getContext('2d');

        let particlesArray;

        // Встановлюємо розмір полотна на весь екран
        function setCanvasSize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        // Клас для створення крапок
        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                // Розмір від 1 до 3 пікселів
                this.size = Math.random() * 2 + 1; 
                // Швидкість падіння
                this.speedY = Math.random() * 1.5 + 0.5; 
                // Легке відхилення по горизонталі
                this.speedX = (Math.random() - 0.5) * 0.5; 
            }

            // Оновлення позиції крапки
            update() {
                this.y += this.speedY;
                this.x += this.speedX;

                // Якщо крапка падає за межі екрану, повертаємо її наверх
                if (this.y > canvas.height) {
                    this.y = 0 - this.size;
                    this.x = Math.random() * canvas.width;
                }
                
                // Якщо крапка вилітає за бокові межі
                if (this.x > canvas.width) {
                    this.x = 0;
                } else if (this.x < 0) {
                    this.x = canvas.width;
                }
            }

            // Малювання крапки
            draw() {
                ctx.fillStyle = '#000000';
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        // Ініціалізація масиву з крапками
        function init() {
            setCanvasSize();
            particlesArray = [];
            const numberOfParticles = 150; // Кількість крапок на екрані
            for (let i = 0; i < numberOfParticles; i++) {
                particlesArray.push(new Particle());
            }
        }

        // Цикл анімації
        function animate() {
            // Очищаємо екран перед кожним кадром
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            for (let i = 0; i < particlesArray.length; i++) {
                particlesArray[i].update();
                particlesArray[i].draw();
            }
            requestAnimationFrame(animate);
        }

        // Запуск
        init();
        animate();

        // Оновлення розміру полотна при зміні розміру вікна браузера
        window.addEventListener('resize', () => {
            setCanvasSize();
            // Перемальовуємо частинки, щоб вони не збиралися в кутку після зміни розміру
            init(); 
        });
    </script>
</body>
</html>
