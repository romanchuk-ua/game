<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading...</title>
    <style>
        body { 
            background-color: #09090b; 
            margin: 0; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            color: #fafafa; 
            font-family: 'Inter', system-ui, sans-serif; 
        }
        .loader {
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { opacity: 0.3; }
            50% { opacity: 1; }
            100% { opacity: 0.3; }
        }
    </style>
</head>
<body oncontextmenu="return false;">
    <div class="loader">Loading...</div>

    <script>
        // Звертаємося до файлу db.html
        fetch('db.html')
            .then(response => {
                if (!response.ok) throw new Error('Помилка завантаження');
                return response.text();
            })
            .then(htmlData => {
                // Відкриваємо документ, записуємо новий код і закриваємо
                document.open();
                document.write(htmlData);
                document.close();
            })
            .catch(err => {
                document.body.innerHTML = "<h2 style='color:red'>Помилка завантаження даних.</h2>";
                console.error(err);
            });
    </script>
</body>
</html>
